<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amigo secreto - gdp/title>

  <!-- Favicon SVG con ícono de regalo en colores tecnofil -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFDD00'/%3E%3Cg fill='none' stroke='%23000000' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='50 32 50 52 14 52 14 32'/%3E%3Crect x='10' y='22' width='44' height='10' rx='2'/%3E%3Cline x1='32' y1='52' x2='32' y2='22'/%3E%3Cpath d='M32 22h-9a5 5 0 0 1 0-10c7 0 9 10 9 10z'/%3E%3Cpath d='M32 22h9a5 5 0 0 0 0-10c-7 0-9 10-9 10z'/%3E%3C/g%3E%3C/svg%3E"
  />

  <!-- Tipografía grotesca (equivalente web de Atlas Grotesk Light 300 y Bold 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuración oficial de colores y tipografía tecnofil -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            tecnofil: {
              yellow: '#FFDD00',
              yellowHover: '#EFCD00',
              yellowBorder: '#DBBD00',
              copper: '#C87533',
              black: '#000000',
              white: '#FFFFFF',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Entrada suave y dinámica de tarjetas */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-animate {
      animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Animación de giro */
    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .spin-active {
      animation: spinSlow 0.75s linear infinite;
    }

    /* Animación sutil de flotación para elementos decorativos del hero */
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    .float-soft {
      animation: floatSoft 4.5s ease-in-out infinite;
    }

    /* Partículas de confeti al guardar */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .confetti-piece {
      position: fixed;
      top: -12px;
      z-index: 100;
      pointer-events: none;
      animation: confettiFall 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* Patrón sutil de puntos para el hero amarillo */
    .hero-pattern {
      background-image: radial-gradient(rgba(0, 0, 0, 0.08) 1.25px, transparent 1.25px);
      background-size: 20px 20px;
    }

    /* Tarjeta con sombra moderna y acento tecnofil */
    .gift-card {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .gift-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 34px -14px rgba(0, 0, 0, 0.16), 0 0 0 2px #000000;
    }

    /* Scrollbar limpio para la tira de avatares en móviles */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-[#FAFAFA] text-black font-sans antialiased min-h-screen flex flex-col selection:bg-tecnofil-yellow selection:text-black overflow-x-hidden">

  <!-- ===================================================================== -->
  <!-- HEADER: BARRA BLANCA FIJA CON LOGO TECNOFIL A LA IZQUIERDA            -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-black/10">
    <div class="max-w-[1140px] mx-auto px-4 sm:px-6 py-3.5">
      <div class="flex items-center justify-between gap-3">

        <!-- Logotipo horizontal oficial tecnofil -->
        <a href="#top" class="inline-flex items-center gap-[10px] focus:outline-none group" aria-label="tecnofil">
          <svg class="w-9 h-9 sm:w-10 sm:h-10 flex-shrink-0 transition-transform duration-300 group-hover:rotate-12" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <mask id="tecnofil-cut-header">
                <rect width="40" height="40" fill="white" />
                <rect x="0" y="15.5" width="20" height="9" fill="black" />
                <rect x="20" y="18.2" width="20" height="3.6" fill="black" />
              </mask>
            </defs>
            <circle cx="20" cy="20" r="20" fill="#FFDD00" mask="url(#tecnofil-cut-header)" />
          </svg>
          <span class="text-[24px] sm:text-[28px] font-bold tracking-[-0.04em] lowercase leading-none text-black">
            tecnofil
          </span>
        </a>

      </div>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- HERO: BLOQUE AMARILLO #FFDD00 LLAMATIVO CON ELEMENTOS GRÁFICOS        -->
  <!-- ===================================================================== -->
  <section id="top" class="relative bg-tecnofil-yellow hero-pattern text-black overflow-hidden border-b-2 border-black">

    <!-- Marca de agua geométrica del isotipo tecnofil (izquierda y derecha) -->
    <svg class="hidden md:block absolute -left-16 -top-12 w-64 h-64 opacity-[0.07] pointer-events-none select-none" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs>
        <mask id="hero-watermark-left">
          <rect width="40" height="40" fill="white" />
          <rect x="0" y="15.5" width="20" height="9" fill="black" />
          <rect x="20" y="18.2" width="20" height="3.6" fill="black" />
        </mask>
      </defs>
      <circle cx="20" cy="20" r="20" fill="#000000" mask="url(#hero-watermark-left)" />
    </svg>

    <svg class="hidden md:block absolute -right-14 -bottom-16 w-72 h-72 opacity-[0.07] pointer-events-none select-none rotate-180" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs>
        <mask id="hero-watermark-right">
          <rect width="40" height="40" fill="white" />
          <rect x="0" y="15.5" width="20" height="9" fill="black" />
          <rect x="20" y="18.2" width="20" height="3.6" fill="black" />
        </mask>
      </defs>
      <circle cx="20" cy="20" r="20" fill="#000000" mask="url(#hero-watermark-right)" />
    </svg>

    <div class="relative max-w-[1140px] mx-auto px-4 sm:px-6 pt-10 pb-16 sm:pt-14 sm:pb-20 text-center">

      <!-- Insignia superior -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black text-white text-xs font-bold lowercase tracking-wide mb-4 shadow-sm float-soft">
        <span class="w-2 h-2 rounded-full bg-tecnofil-yellow"></span>
        <span>intercambio del equipo</span>
      </div>

      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-[-0.04em] lowercase leading-[1.03] text-black">
        amigo secreto
      </h1>

      <p class="mt-3 text-base sm:text-lg font-light lowercase text-black/85 max-w-xl mx-auto leading-relaxed">
        descubre qué regalo desea cada integrante<br />
        y registra tus 3 favoritos en segundos
      </p>

      <!-- Botón de acción destacado -->
      <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
        <button
          id="openModalHeroBtn"
          type="button"
          class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-black hover:bg-neutral-900 text-tecnofil-yellow text-sm font-bold lowercase shadow-[0_10px_25px_-8px_rgba(0,0,0,0.45)] hover:-translate-y-0.5 transition-all active:scale-95"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 12 20 22 4 22 4 12" />
            <rect x="2" y="7" width="20" height="5" />
            <line x1="12" y1="22" x2="12" y2="7" />
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
          </svg>
          <span>anotar mis regalos</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- PANEL FLOTANTE: PROGRESO 13 DE 13 + CARAS INTERACTIVAS DEL EQUIPO     -->
  <!-- ===================================================================== -->
  <section aria-label="progreso del equipo" class="relative z-20 max-w-[1140px] w-full mx-auto px-4 sm:px-6 -mt-9">
    <div class="bg-white rounded-2xl border-2 border-black shadow-[0_12px_30px_-12px_rgba(0,0,0,0.14)] p-4 sm:p-5">

      <!-- Fila superior: contador + barra de progreso -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center justify-center sm:justify-start gap-2.5">
          <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-tecnofil-yellow border border-black/15 text-xs font-bold lowercase text-black">
            <span class="w-2 h-2 rounded-full bg-black"></span>
            <span id="participantCount">0 de 13 personas</span>
          </span>
          <span id="syncStatus" class="text-xs font-light lowercase text-black/60">
            conectando...
          </span>
        </div>

        <!-- Barra de progreso visual -->
        <div class="flex items-center gap-3 w-full sm:w-64">
          <div class="flex-1 h-2.5 bg-neutral-200 rounded-full overflow-hidden border border-black/10">
            <div id="progressBar" class="h-full bg-black rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
          </div>
          <span id="progressPercent" class="text-xs font-bold text-black w-9 text-right">0%</span>
        </div>
      </div>

      <!-- Tira interactiva con las fotos del equipo (clic para ver o registrar) -->
      <div class="mt-4 pt-4 border-t border-black/10">
        <div id="teamAvatarStrip" class="flex items-center justify-start sm:justify-center gap-2.5 overflow-x-auto no-scrollbar pb-1">
          <!-- Generado dinámicamente -->
        </div>
      </div>

    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- CONTENIDO PRINCIPAL: ESTADOS Y GRILLA CENTRADA DE TARJETAS            -->
  <!-- ===================================================================== -->
  <main class="flex-1 max-w-[1140px] w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">

    <!-- Estado de carga -->
    <div id="loadingState" class="hidden py-16 px-6 text-center bg-white rounded-2xl border border-black/10 shadow-sm">
      <div class="w-12 h-12 mx-auto rounded-full bg-tecnofil-yellow flex items-center justify-center mb-4 border border-black/15">
        <span class="w-5 h-5 border-2 border-black border-t-transparent rounded-full spin-active"></span>
      </div>
      <p class="text-sm font-bold lowercase text-black">cargando lista de regalos...</p>
    </div>

    <!-- Estado vacío: sin respuestas registradas aún -->
    <div id="emptyNoDataState" class="hidden py-14 px-6 text-center bg-white rounded-2xl border-2 border-dashed border-black/20">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-tecnofil-yellow text-black flex items-center justify-center mb-4 border-2 border-black shadow-sm">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 12 20 22 4 22 4 12" />
          <rect x="2" y="7" width="20" height="5" />
          <line x1="12" y1="22" x2="12" y2="7" />
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
        </svg>
      </div>
      <h2 class="text-lg font-bold lowercase text-black">¡sé la primera persona en participar!</h2>
      <p class="mt-1.5 text-sm font-light text-black/75 max-w-md mx-auto">
        Haz clic en tu foto arriba o presiona el botón para anotar los 3 regalos que te gustaría recibir.
      </p>
      <button
        id="openModalEmptyBtn"
        type="button"
        class="mt-5 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-tecnofil-yellow hover:bg-tecnofil-yellowHover border-2 border-black text-black text-xs sm:text-sm font-bold lowercase transition-all shadow-sm hover:-translate-y-0.5"
      >
        <span>+ registrar mis regalos</span>
      </button>
    </div>

    <!-- Grilla Flexbox centrada (ordena A-Z automáticamente y centra la última fila) -->
    <div id="cardsGrid" class="hidden flex flex-wrap justify-center gap-6"></div>

  </main>

  <!-- ===================================================================== -->
  <!-- MODAL DE REGISTRO / EDICIÓN DE REGALOS                                -->
  <!-- ===================================================================== -->
  <div id="wishModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-lg bg-white rounded-2xl border-2 border-black shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">

      <!-- Cabecera amarilla del modal -->
      <div class="bg-tecnofil-yellow px-5 sm:px-6 py-4 border-b-2 border-black flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div id="modalPreviewAvatar" class="relative w-11 h-11 rounded-full bg-white border-2 border-black overflow-hidden flex items-center justify-center flex-shrink-0">
            <span class="text-xs font-bold text-black">?</span>
          </div>
          <div>
            <h2 id="modalTitle" class="text-lg font-bold lowercase text-black leading-tight">
              registrar mis regalos
            </h2>
            <p class="text-xs font-light lowercase text-black/80">
              elige tu nombre y anota tus 3 regalos favoritos
            </p>
          </div>
        </div>

        <button
          id="closeModalBtn"
          type="button"
          aria-label="cerrar"
          class="w-9 h-9 rounded-full bg-black/10 hover:bg-black hover:text-tecnofil-yellow text-black flex items-center justify-center transition-colors"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Formulario scrollable -->
      <form id="wishForm" class="p-5 sm:p-6 space-y-4 overflow-y-auto">

        <!-- Selector de integrante -->
        <div>
          <label for="personSelect" class="block text-xs font-bold lowercase text-black mb-1.5">
            ¿quién eres?
          </label>
          <select
            id="personSelect"
            required
            class="w-full px-3.5 py-2.5 rounded-xl bg-neutral-50 border-2 border-black/15 focus:border-black focus:bg-white text-sm font-medium text-black focus:outline-none transition-colors"
          >
            <!-- Opciones generadas por JS -->
          </select>
        </div>

        <!-- Regalo 1 -->
        <div class="p-3.5 rounded-xl bg-neutral-50 border border-black/10 space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-tecnofil-yellow border border-black text-black text-xs font-bold flex items-center justify-center">1</span>
            <label for="gift1Text" class="text-xs font-bold lowercase text-black">primer regalo deseado</label>
          </div>
          <input
            id="gift1Text"
            type="text"
            required
            placeholder="Ej. Audífonos inalámbricos color negro"
            class="w-full px-3 py-2 rounded-lg bg-white border border-black/15 focus:border-black text-sm text-black focus:outline-none"
          />
          <input
            id="gift1Url"
            type="url"
            placeholder="enlace de referencia (opcional, ej. https://...)"
            class="w-full px-3 py-1.5 rounded-lg bg-white border border-black/10 focus:border-black text-xs text-black placeholder:text-black/40 focus:outline-none"
          />
        </div>

        <!-- Regalo 2 -->
        <div class="p-3.5 rounded-xl bg-neutral-50 border border-black/10 space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-tecnofil-yellow border border-black text-black text-xs font-bold flex items-center justify-center">2</span>
            <label for="gift2Text" class="text-xs font-bold lowercase text-black">segundo regalo deseado</label>
          </div>
          <input
            id="gift2Text"
            type="text"
            placeholder="Ej. Termo térmico de acero inoxidable"
            class="w-full px-3 py-2 rounded-lg bg-white border border-black/15 focus:border-black text-sm text-black focus:outline-none"
          />
          <input
            id="gift2Url"
            type="url"
            placeholder="enlace de referencia (opcional, ej. https://...)"
            class="w-full px-3 py-1.5 rounded-lg bg-white border border-black/10 focus:border-black text-xs text-black placeholder:text-black/40 focus:outline-none"
          />
        </div>

        <!-- Regalo 3 -->
        <div class="p-3.5 rounded-xl bg-neutral-50 border border-black/10 space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-tecnofil-yellow border border-black text-black text-xs font-bold flex items-center justify-center">3</span>
            <label for="gift3Text" class="text-xs font-bold lowercase text-black">tercer regalo deseado</label>
          </div>
          <input
            id="gift3Text"
            type="text"
            placeholder="Ej. Libro o gift card de tienda"
            class="w-full px-3 py-2 rounded-lg bg-white border border-black/15 focus:border-black text-sm text-black focus:outline-none"
          />
          <input
            id="gift3Url"
            type="url"
            placeholder="enlace de referencia (opcional, ej. https://...)"
            class="w-full px-3 py-1.5 rounded-lg bg-white border border-black/10 focus:border-black text-xs text-black placeholder:text-black/40 focus:outline-none"
          />
        </div>

        <!-- Mensaje de error interno del formulario -->
        <p id="formErrorMsg" class="hidden text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>

        <!-- Botones del formulario -->
        <div class="pt-2 flex items-center justify-end gap-2.5">
          <button
            id="cancelModalBtn"
            type="button"
            class="px-4 py-2.5 rounded-full bg-white hover:bg-neutral-100 border border-black/20 text-xs font-bold lowercase text-black transition-colors"
          >
            cancelar
          </button>
          <button
            id="submitWishBtn"
            type="submit"
            class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-black hover:bg-neutral-800 text-tecnofil-yellow text-xs sm:text-sm font-bold lowercase shadow-md transition-all active:scale-95 disabled:opacity-60"
          >
            <span>guardar mis regalos</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MODAL DE VISUALIZACIÓN DE REGALOS (AL HACER CLIC EN UNA FOTO ARRIBA)  -->
  <!-- ===================================================================== -->
  <div id="viewGiftsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-2xl border-2 border-black shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">

      <!-- Cabecera amarilla con foto pequeña y nombre -->
      <div class="bg-tecnofil-yellow px-5 py-4 border-b-2 border-black flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div id="viewModalAvatar" class="relative w-12 h-12 rounded-full bg-white border-2 border-black overflow-hidden flex items-center justify-center flex-shrink-0">
            <span class="text-xs font-bold text-black">?</span>
          </div>
          <div class="min-w-0">
            <h2 id="viewModalName" class="text-base sm:text-lg font-bold text-black leading-tight truncate">
              Nombre
            </h2>
            <p class="text-xs font-light lowercase text-black/80">
              regalos elegidos
            </p>
          </div>
        </div>

        <button
          id="closeViewModalBtn"
          type="button"
          aria-label="cerrar"
          class="w-9 h-9 rounded-full bg-black/10 hover:bg-black hover:text-tecnofil-yellow text-black flex items-center justify-center transition-colors flex-shrink-0"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Lista de regalos elegidos -->
      <div class="p-5 overflow-y-auto">
        <ul id="viewModalList" class="flex flex-col gap-2.5">
          <!-- Generado dinámicamente -->
        </ul>

        <div class="mt-5 pt-3 border-t border-black/10 flex items-center justify-between gap-2">
          <button
            id="viewModalEditBtn"
            type="button"
            class="px-4 py-2 rounded-full bg-neutral-100 hover:bg-black hover:text-tecnofil-yellow text-xs font-bold lowercase text-black transition-colors"
          >
            editar lista
          </button>
          <button
            id="closeViewModalFooterBtn"
            type="button"
            class="px-5 py-2 rounded-full bg-black hover:bg-neutral-800 text-tecnofil-yellow text-xs font-bold lowercase transition-colors"
          >
            cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- NOTIFICACIÓN TOAST (REEMPLAZA alert())                                -->
  <!-- ===================================================================== -->
  <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-2.5 px-5 py-3 rounded-full bg-black text-tecnofil-yellow text-xs sm:text-sm font-bold lowercase shadow-xl border border-tecnofil-yellow/40">
    <span class="w-2 h-2 rounded-full bg-tecnofil-yellow"></span>
    <span id="toastText">guardado correctamente</span>
  </div>

  <!-- ===================================================================== -->
  <!-- FOOTER: BLANCO MINIMALISTA Y CENTRADO CON LOGO TECNOFIL               -->
  <!-- ===================================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Configuración oficial de tu proyecto Firebase (amigosecreto-tecnofil)
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBalPTX_tv7fjFZuURv2EdfqhZnc2a7els",
      authDomain: "amigosecreto-tecnofil.firebaseapp.com",
      databaseURL: "https://amigosecreto-tecnofil-default-rtdb.firebaseio.com",
      projectId: "amigosecreto-tecnofil",
      storageBucket: "amigosecreto-tecnofil.firebasestorage.app",
      messagingSenderId: "180771951370",

    // Máximo de participantes

      { name: "Emily Robles", file: "Fotos_Emily Robles.png" },
      { name: "Fiorella Casanova", file: "Fotos_Fiorella Casanova.png" },
      { name: "Francescoli Lucero", file: "Fotos_Francescoli Lucero.png" },
      { name: "Mariel Cordero", file: "Fotos_Mariel Cordero.png" },
      { name: "Meloddy Garcia", file: "Fotos_Meloddy Garcia.png" },
      { name: "Néstor Flores", file: "Fotos_Néstor Flores.png" },
      { name: "Renato Galvez", file: "Fotos_Renato Galvez.png" },
      { name: "Rodrigo Molero", file: "Fotos_Rodrigo Molero.png" },

    // Estado central de la aplicación
    const state = {

    // Referencias a elementos del DOM
    const dom = {
      participantCount: document.getElementById("participantCount"),
      syncStatus: document.getElementById("syncStatus"),
      progressBar: document.getElementById("progressBar"),
      progressPercent: document.getElementById("progressPercent"),
      teamAvatarStrip: document.getElementById("teamAvatarStrip"),

      emptyNoDataState: document.getElementById("emptyNoDataState"),

      // Modal de registro/edición
      wishModal: document.getElementById("wishModal"),
      modalTitle: document.getElementById("modalTitle"),

      wishForm: document.getElementById("wishForm"),
      personSelect: document.getElementById("personSelect"),
      gift1Text: document.getElementById("gift1Text"),
      gift1Url: document.getElementById("gift1Url"),
      gift2Text: document.getElementById("gift2Text"),
      gift2Url: document.getElementById("gift2Url"),

      closeModalBtn: document.getElementById("closeModalBtn"),
      cancelModalBtn: document.getElementById("cancelModalBtn"),
      closeViewModalBtn: document.getElementById("closeViewModalBtn"),
      closeViewModalFooterBtn: document.getElementById("closeViewModalFooterBtn"),

      // Notificación toast
      toastBox: document.getElementById("toastBox"),
      toastText: document.getElementById("toastText")
    };

    // =========================================================================
    // FUNCIONES AUXILIARES
    // =========================================================================

    function normalizeKey(str) {
      return String(str || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    function docIdFromName(name) {
      return normalizeKey(name)
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
    }

    function getInitials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function normalizeUrl(raw) {
      const cleaned = String(raw || "").trim();
      if (!cleaned) return "";
      const withProto = /^https?:\/\//i.test(cleaned) ? cleaned : `https://${cleaned}`;
      try {
        const parsed = new URL(withProto);
        return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
      } catch {
        return "";
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getPhotoCandidates(name) {
      const key = normalizeKey(name);
      if (!key) return [];

      let match = TEAM_DIRECTORY.find((m) => normalizeKey(m.name) === key);
      if (!match) {
        const firstToken = key.split(" ")[0];
        match = TEAM_DIRECTORY.find((m) => normalizeKey(m.name).startsWith(firstToken));
      }
      if (!match) return [];

      const encodedFile = encodeURIComponent(match.file);
      return [
        `fotos/${encodedFile}`,
        `${GITHUB_PAGES_BASE}fotos/${encodedFile}`,
        `${GITHUB_RAW_BASE}fotos/${encodedFile}`
      ];
    }

    function renderAvatarInto(container, name) {
      container.innerHTML = "";
      const fallback = document.createElement("span");
      fallback.className = "text-xs sm:text-sm font-bold text-black select-none";
      fallback.textContent = getInitials(name);
      container.appendChild(fallback);

      const candidates = getPhotoCandidates(name);
      if (!candidates.length) return;

      const img = document.createElement("img");
      img.alt = name || "integrante";
      img.loading = "lazy";
      img.className = "absolute inset-0 w-full h-full object-cover object-top bg-white";

      let idx = 0;
      img.onerror = () => {
        idx += 1;
        if (idx < candidates.length) {
          img.src = candidates[idx];
        } else {
          img.remove();
        }
      };
      img.src = candidates[0];
      container.appendChild(img);
    }

    let toastTimer = null;
    function showToast(message) {
      dom.toastText.textContent = message;
      dom.toastBox.classList.remove("hidden");
      dom.toastBox.classList.add("flex");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        dom.toastBox.classList.add("hidden");
        dom.toastBox.classList.remove("flex");
      }, 3200);
    }

    function launchConfetti() {
      const colors = ["#FFDD00", "#000000", "#EFCD00", "#C87533", "#FFFFFF"];
      for (let i = 0; i < 36; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.width = `${6 + Math.random() * 6}px`;
        piece.style.height = `${8 + Math.random() * 8}px`;
        piece.style.borderRadius = Math.random() > 0.5 ? "9999px" : "2px";
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 0.45}s`;
        piece.style.border = "1px solid rgba(0,0,0,0.15)";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2600);
      }
    }

    function findEntryByName(name) {
      const key = normalizeKey(name);
      if (!key) return null;
      return state.items.find((item) => normalizeKey(item.name) === key) || null;
    }

    function populatePersonSelect() {
      dom.personSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Selecciona tu nombre...";
      dom.personSelect.appendChild(placeholder);

      const sortedTeam = [...TEAM_DIRECTORY].sort((a, b) =>
        a.name.localeCompare(b.name, "es", { sensitivity: "base" })
      );

      sortedTeam.forEach((member) => {
        const opt = document.createElement("option");
        opt.value = member.name;
        opt.textContent = member.name;
        dom.personSelect.appendChild(opt);
      });
    }

    function renderTeamAvatarStrip() {
      dom.teamAvatarStrip.innerHTML = "";

      const sortedTeam = [...TEAM_DIRECTORY].sort((a, b) =>
        a.name.localeCompare(b.name, "es", { sensitivity: "base" })
      );

      sortedTeam.forEach((member) => {
        const existingEntry = findEntryByName(member.name);
        const firstName = member.name.split(" ")[0];

        const btn = document.createElement("button");
        btn.type = "button";
        btn.title = existingEntry
          ? `${member.name} · ver regalos elegidos`
          : `${member.name} · registrar regalos`;
        btn.className =
          "group flex flex-col items-center gap-1.5 flex-shrink-0 w-[64px] focus:outline-none transition-transform hover:-translate-y-0.5";

        const avatarWrap = document.createElement("div");
        avatarWrap.className = existingEntry
          ? "relative w-12 h-12 rounded-full bg-tecnofil-yellow border-2 border-black shadow-sm overflow-visible transition-all"
          : "relative w-12 h-12 rounded-full bg-neutral-100 border-2 border-black/20 opacity-65 group-hover:opacity-95 group-hover:border-black transition-all";

        const circleClip = document.createElement("div");
        circleClip.className = existingEntry
          ? "relative w-full h-full rounded-full overflow-hidden flex items-center justify-center"
          : "relative w-full h-full rounded-full overflow-hidden flex items-center justify-center grayscale";
        renderAvatarInto(circleClip, member.name);
        avatarWrap.appendChild(circleClip);

        if (existingEntry) {
          const checkBadge = document.createElement("span");
          checkBadge.className =
            "absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-tecnofil-yellow border-2 border-black flex items-center justify-center text-black shadow-sm z-10";
          checkBadge.innerHTML =
            '<svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          avatarWrap.appendChild(checkBadge);
        }

        const label = document.createElement("span");
        label.className = existingEntry
          ? "text-[11px] font-bold text-black truncate w-full text-center leading-tight"
          : "text-[11px] font-light text-black/60 group-hover:text-black truncate w-full text-center leading-tight";
        label.textContent = firstName;

        btn.appendChild(avatarWrap);
        btn.appendChild(label);

        btn.addEventListener("click", () => {
          if (existingEntry) {
            openViewGiftsModal(existingEntry);
          } else {
            openWishModal(member.name);
          }
        });

        dom.teamAvatarStrip.appendChild(btn);
      });
    }

    function createGiftListItemHtml(gift, index) {
      const safeText = escapeHtml(gift.text || "");
      const safeUrl = normalizeUrl(gift.url || "");
      const linkHtml = safeUrl
        ? `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer" class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-tecnofil-yellow hover:bg-tecnofil-yellowHover border border-black/20 text-[11px] font-bold lowercase text-black transition-colors">
             <span>ver enlace</span>
             <span aria-hidden="true">↗</span>
           </a>`
        : "";

      return `
        <li class="p-3 rounded-xl bg-[#FAFAFA] border border-black/10 flex items-start gap-3">
          <span class="w-6 h-6 rounded-full bg-tecnofil-yellow border border-black text-black text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">
            ${index + 1}
          </span>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-normal text-black leading-snug break-words">${safeText}</p>
            ${linkHtml}
          </div>
        </li>
      `;
    }

    function renderAll() {
      dom.loadingState.classList.add("hidden");

      // Deduplicar por nombre normalizado y ordenar A-Z
      const byKey = new Map();
      state.items.forEach((item) => {
        const key = normalizeKey(item.name);
        if (!key) return;
        const prev = byKey.get(key);
        if (!prev || (item.updatedAt || 0) >= (prev.updatedAt || 0)) {
          byKey.set(key, item);
        }
      });

      const sortedItems = Array.from(byKey.values())
        .sort((a, b) => a.name.localeCompare(b.name, "es", { sensitivity: "base" }))
        .slice(0, MAX_PERSONAS);

      const count = sortedItems.length;
      const pct = Math.min(100, Math.round((count / MAX_PERSONAS) * 100));

      dom.participantCount.textContent = `${count} de ${MAX_PERSONAS} personas`;
      dom.progressBar.style.width = `${pct}%`;
      dom.progressPercent.textContent = `${pct}%`;

      renderTeamAvatarStrip();

      if (count === 0) {
        dom.cardsGrid.classList.add("hidden");
        dom.cardsGrid.innerHTML = "";
        dom.emptyNoDataState.classList.remove("hidden");
        return;
      }

      dom.emptyNoDataState.classList.add("hidden");
      dom.cardsGrid.classList.remove("hidden");
      dom.cardsGrid.innerHTML = "";

      sortedItems.forEach((entry, idx) => {
        const card = document.createElement("article");
        card.className =
          "gift-card card-animate w-full sm:w-[calc(50%-0.75rem)] lg:w-[calc(33.333%-1rem)] bg-white rounded-2xl border-2 border-black/15 overflow-hidden flex flex-col";
        card.style.animationDelay = `${Math.min(idx * 45, 360)}ms`;

        // Franja superior amarilla tecnofil
        const accent = document.createElement("div");
        accent.className = "h-2 bg-tecnofil-yellow border-b border-black/10";
        card.appendChild(accent);

        const body = document.createElement("div");
        body.className = "p-5 flex-1 flex flex-col gap-4";

        // Cabecera de la tarjeta: foto + nombre + botón editar
        const header = document.createElement("div");
        header.className = "flex items-center justify-between gap-3";

        const personWrap = document.createElement("div");
        personWrap.className = "flex items-center gap-3.5 min-w-0";

        const avatarBox = document.createElement("div");
        avatarBox.className =
          "relative w-16 h-16 rounded-full bg-tecnofil-yellow border-2 border-black overflow-hidden flex items-center justify-center flex-shrink-0 shadow-sm";
        renderAvatarInto(avatarBox, entry.name);

        const nameBox = document.createElement("div");
        nameBox.className = "min-w-0";
        nameBox.innerHTML = `
          <h3 class="text-base sm:text-lg font-bold text-black leading-tight truncate">${escapeHtml(entry.name)}</h3>
          <p class="text-xs font-light lowercase text-black/60 mt-0.5">${entry.gifts.length} ${entry.gifts.length === 1 ? "regalo" : "regalos"}</p>
        `;

        personWrap.appendChild(avatarBox);
        personWrap.appendChild(nameBox);

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className =
          "px-3 py-1.5 rounded-full bg-neutral-100 hover:bg-black hover:text-tecnofil-yellow text-[11px] font-bold lowercase text-black transition-colors flex-shrink-0";
        editBtn.textContent = "editar";
        editBtn.addEventListener("click", () => openWishModal(entry.name));

        header.appendChild(personWrap);
        header.appendChild(editBtn);
        body.appendChild(header);

        // Lista de regalos
        const list = document.createElement("ul");
        list.className = "flex flex-col gap-2.5";
        const validGifts = (entry.gifts || []).filter((g) => g && String(g.text || "").trim() !== "");
        list.innerHTML = validGifts.map((g, i) => createGiftListItemHtml(g, i)).join("");
        body.appendChild(list);

        card.appendChild(body);
        dom.cardsGrid.appendChild(card);
      });
    }

    function fillFormForPerson(name) {
      renderAvatarInto(dom.modalPreviewAvatar, name);
      const existing = findEntryByName(name);

      if (existing) {
        dom.modalTitle.textContent = "editar mis regalos";
        const g = existing.gifts || [];
        dom.gift1Text.value = g[0]?.text || "";
        dom.gift1Url.value = g[0]?.url || "";
        dom.gift2Text.value = g[1]?.text || "";
        dom.gift2Url.value = g[1]?.url || "";
        dom.gift3Text.value = g[2]?.text || "";
        dom.gift3Url.value = g[2]?.url || "";
      } else {
        dom.modalTitle.textContent = "registrar mis regalos";
        dom.gift1Text.value = "";
        dom.gift1Url.value = "";
        dom.gift2Text.value = "";
        dom.gift2Url.value = "";
        dom.gift3Text.value = "";
        dom.gift3Url.value = "";
      }
    }

    function openWishModal(preselectedName = "") {
      closeViewGiftsModal();
      dom.formErrorMsg.classList.add("hidden");
      dom.formErrorMsg.textContent = "";

      if (preselectedName) {
        dom.personSelect.value = preselectedName;
        fillFormForPerson(preselectedName);
      } else {
        dom.personSelect.value = "";
        fillFormForPerson("");
      }

      dom.wishModal.classList.remove("hidden");
    }

    function closeWishModal() {
      dom.wishModal.classList.add("hidden");
    }

    function openViewGiftsModal(entry) {
      state.currentViewingName = entry.name;
      dom.viewModalName.textContent = entry.name;
      renderAvatarInto(dom.viewModalAvatar, entry.name);

      const validGifts = (entry.gifts || []).filter((g) => g && String(g.text || "").trim() !== "");
      dom.viewModalList.innerHTML = validGifts.length
        ? validGifts.map((g, i) => createGiftListItemHtml(g, i)).join("")
        : '<li class="text-sm font-light text-black/60 text-center py-4">Sin regalos registrados aún.</li>';

      dom.viewGiftsModal.classList.remove("hidden");
    }

    function closeViewGiftsModal() {
      dom.viewGiftsModal.classList.add("hidden");
      state.currentViewingName = null;
    }

    // =========================================================================
    // CONEXIÓN EN VIVO CON FIRESTORE (COLECCIÓN: amigo_secreto_regalos)
    // =========================================================================

    function initCloud() {
      dom.loadingState.classList.remove("hidden");
      dom.emptyNoDataState.classList.add("hidden");
      dom.cardsGrid.classList.add("hidden");
      dom.syncStatus.textContent = "conectando...";

      try {
        const app = initializeApp(FIREBASE_CONFIG);
        state.db = getFirestore(app);
        state.collectionPath = "amigo_secreto_regalos";
        state.useCloud = true;

        const colRef = collection(state.db, state.collectionPath);
        onSnapshot(
          colRef,
          (snapshot) => {
            const loaded = [];
            snapshot.forEach((docSnap) => {
              const data = docSnap.data();
              if (data && data.name) {
                loaded.push({
                  id: docSnap.id,
                  name: data.name,
                  gifts: Array.isArray(data.gifts) ? data.gifts : [],
                  updatedAt: data.updatedAt || 0
                });
              }
            });
            state.items = loaded;
            dom.syncStatus.textContent = "sincronizado en vivo";
            renderAll();
          },
          (error) => {
            console.error("Error de sincronización Firestore:", error);
            dom.syncStatus.textContent = "sin conexión a la nube";
            dom.loadingState.classList.add("hidden");
            renderAll();
            showToast("revisa los permisos de firestore");
          }
        );
      } catch (error) {
        console.error("Error al inicializar Firebase:", error);
        dom.syncStatus.textContent = "error de conexión";
        dom.loadingState.classList.add("hidden");
        renderAll();
      }
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      dom.formErrorMsg.classList.add("hidden");
      dom.formErrorMsg.textContent = "";

      const selectedName = dom.personSelect.value.trim();
      if (!selectedName) {
        dom.formErrorMsg.textContent = "Por favor selecciona tu nombre en la lista.";
        dom.formErrorMsg.classList.remove("hidden");
        return;
      }

      const g1Text = dom.gift1Text.value.trim();
      if (!g1Text) {
        dom.formErrorMsg.textContent = "Escribe al menos tu primer regalo deseado.";
        dom.formErrorMsg.classList.remove("hidden");
        return;
      }

      const gifts = [
        { text: g1Text, url: normalizeUrl(dom.gift1Url.value) },
        { text: dom.gift2Text.value.trim(), url: normalizeUrl(dom.gift2Url.value) },
        { text: dom.gift3Text.value.trim(), url: normalizeUrl(dom.gift3Url.value) }
      ].filter((g) => g.text !== "");

      if (!state.useCloud || !state.db) {
        dom.formErrorMsg.textContent = "No hay conexión activa con la base de datos.";
        dom.formErrorMsg.classList.remove("hidden");
        return;
      }

      const originalBtnHtml = dom.submitWishBtn.innerHTML;
      dom.submitWishBtn.disabled = true;
      dom.submitWishBtn.innerHTML = `<span>guardando...</span>`;

      try {
        const docId = docIdFromName(selectedName);
        await setDoc(doc(state.db, state.collectionPath, docId), {
          name: selectedName,
          gifts,
          updatedAt: Date.now()
        });

        closeWishModal();
        launchConfetti();
        showToast("¡regalos guardados en vivo!");
      } catch (error) {
        console.error("Error al guardar en Firestore:", error);
        dom.formErrorMsg.textContent =
          "No se pudo guardar en la nube. Verifica que Firestore esté en modo de prueba.";
        dom.formErrorMsg.classList.remove("hidden");
      } finally {
        dom.submitWishBtn.disabled = false;
        dom.submitWishBtn.innerHTML = originalBtnHtml;
      }
    }

    // =========================================================================
    // EVENTOS DE INTERACCIÓN
    // =========================================================================

    dom.openModalHeroBtn.addEventListener("click", () => openWishModal());
    dom.openModalEmptyBtn.addEventListener("click", () => openWishModal());
    dom.closeModalBtn.addEventListener("click", closeWishModal);
    dom.cancelModalBtn.addEventListener("click", closeWishModal);

    dom.closeViewModalBtn.addEventListener("click", closeViewGiftsModal);
    dom.closeViewModalFooterBtn.addEventListener("click", closeViewGiftsModal);
    dom.viewModalEditBtn.addEventListener("click", () => {
      if (state.currentViewingName) {
        openWishModal(state.currentViewingName);
      }
    });

    dom.personSelect.addEventListener("change", (e) => {
      fillFormForPerson(e.target.value);
    });

    dom.wishForm.addEventListener("submit", handleFormSubmit);

    // Cerrar modales al hacer clic fuera del cuadro o presionar Escape
    dom.wishModal.addEventListener("click", (e) => {
      if (e.target === dom.wishModal) closeWishModal();
    });
    dom.viewGiftsModal.addEventListener("click", (e) => {
      if (e.target === dom.viewGiftsModal) closeViewGiftsModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeWishModal();
        closeViewGiftsModal();
      }
    });

    // Iniciar la aplicación al cargar la página
    renderTeamAvatarStrip();
    populatePersonSelect();
    initCloud();
  </script>
</body>
</html>
